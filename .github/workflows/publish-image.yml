name: Publish Image

# Builds the Action's image for each version tag `make bump` creates. action.yml
# names that image, so the tag has to be pushed before its commit reaches main.
# The `v*` tags Release Drafter creates deliberately don't match.
on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # arm64 too, since Docker actions built from the Dockerfile ran on arm runners.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/devsetgo/ai-pr-assistant:${{ github.ref_name }}
          # Links the package to this repo so its page shows up on the repo.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
