name: Release Drafter

# Release Drafter v7 splits the work into two actions: the drafter (release
# notes) runs when changes land on main, and the autolabeler runs on PRs.
on:
  push:
    branches:
      - main
  # Deliberately `pull_request`, not `pull_request_target`: GitHub restricts
  # pull_request_target on public repos by default from 2026-11-02. The cost is
  # that PRs from forks (read-only token) aren't auto-labeled - acceptable here,
  # since every branch this project's maintainers push is same-repo.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    if: github.event_name == 'push'
    permissions:
      # write permission is required to create a github release
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "main"
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  autolabel:
    # Dependabot PRs get a read-only token here, so labeling would 403; Dependabot
    # labels its own PRs (see .github/dependabot.yaml), same as the guard in sonar.yaml.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
