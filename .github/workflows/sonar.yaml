name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Skip SonarCloud for Dependabot PRs (secrets not available)
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Run tests and generate coverage.xml
        run: |
          # Run the full test suite for accurate SonarCloud coverage reporting.
          # Override addopts to avoid duplicate --cov/--cov-report flags from pyproject.toml.
          # Pass tests/ explicitly so testpaths resolution is not affected by -o addopts=.
          python -m pytest -o addopts= --cov=pr_description --cov-report=xml:coverage.xml tests/

          # Normalize Cobertura <sources> so Sonar can resolve both styles of filenames:
          # - filenames like "pr_description/foo.py" resolve via "."
          # - filenames like "__init__.py" resolve via "pr_description"
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("coverage.xml")
          text = path.read_text("utf-8")
          sources_block = "<sources>\n  <source>.</source>\n  <source>pr_description</source>\n</sources>"
          new_text, count = re.subn(r"<sources>.*?</sources>", sources_block, text, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f"Expected to replace 1 <sources> block, replaced {count}")
          path.write_text(new_text, "utf-8")
          print("Normalized coverage.xml <sources>")
          PY

      - name: Verify coverage report exists
        run: |
          ls -la coverage.xml
          python -c "from pathlib import Path; print('coverage.xml bytes:', Path('coverage.xml').stat().st_size)"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          projectBaseDir: .
        env:
          GITHUB_TOKEN: ${{ github.token }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
