# Configuration for release-drafter/release-drafter
# This file must live in the default branch at: .github/release-drafter.yml

name-template: "Release Notes (Draft)"

autolabeler:
  - label: "breaking"
    branch:
      - "/^breaking[/-].+/"
  - label: "feature"
    branch:
      - "/^feat(ure)?[/-].+/"
  - label: "enhancement"
    branch:
      - "/^enhance[/-].+/"
      - "/^improvement[/-].+/"
  - label: "bug"
    branch:
      - "/^(fix|bugfix|hotfix)[/-].+/"
  - label: "docs"
    branch:
      - "/^docs?[/-].+/"
  - label: "code improvements"
    branch:
      - "/^(refactor|optimize|perf|performance)[/-].+/"
  - label: "github actions"
    branch:
      - "/^(ci|actions?|workflow)[/-].+/"
  - label: "chore"
    branch:
      - "/^(chore|test|cleanup)[/-].+/"
  - label: "dependencies"
    branch:
      - "/^(dep|deps|bump|dependabot)[/-].+/"

categories:
  - title: "Breaking Changes"
    when:
      labels:
        - "breaking"
        - "breaking-change"
  - title: "Features"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "Bug Fixes"
    when:
      labels:
        - "bug"
        - "fix"
  - title: "Documentation"
    when:
      labels:
        - "docs"
        - "documentation"
  - title: "Code Improvements"
    when:
      labels:
        - "code improvements"
        - "refactor"
  - title: "GitHub Actions"
    when:
      labels:
        - "github actions"
  - title: "Maintenance"
    when:
      labels:
        - "chore"
        - "dependencies"

change-template: "- $TITLE (#$NUMBER) (@$AUTHOR)"
change-title-escapes: "<*_&"

template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS
