[project]
name = "ai-pr-assistant"
version = "26.09.18-001"
description = "GitHub Action that autofills a pull request's description, title, and labels using OpenAI"
requires-python = ">=3.12"

[tool.bumpcalver]
version_format = "{current_date}-{build_count:03}"
date_format = "%y.%m.%d"
timezone = "America/New_York"
git_tag = true
auto_commit = true

[[tool.bumpcalver.file]]
path = "pyproject.toml"
file_type = "toml"
variable = "project.version"

[[tool.bumpcalver.file]]
path = "pr_description/__init__.py"
file_type = "python"
variable = "__version__"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pr_description --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["pr_description"]
