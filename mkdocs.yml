site_name: AI PR Assistant
site_description: Generate pull request descriptions, titles, and labels using OpenAI.
site_url: https://devsetgo.github.io/ai-pr-assistant/
repo_name: devsetgo/ai-pr-assistant
repo_url: https://github.com/devsetgo/ai-pr-assistant

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Setup: SETUP.md
  - Configuration: CONFIGURATION.md
  - Changelog: CHANGELOG.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Migrating: MIGRATING.md

theme:
  custom_dir: overrides
  version: default
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

extra:
  generator: false

extra_javascript:
  - javascripts/copyright-year.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
