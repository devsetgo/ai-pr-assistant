name: 'AI PR Assistant'
description: "Autofill your pull request's description, title, and labels using OpenAI or Claude"
inputs:
  github_token:
    description: 'The GitHub token'
    required: true
  provider:
    description: 'Which AI provider to use: "openai" (also covers Azure OpenAI) or "anthropic" (Claude, via the direct Anthropic API)'
    required: false
    default: 'openai'
  openai_api_key:
    description: 'OpenAI API key. Required when provider is openai.'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Anthropic API key. Required when provider is anthropic.'
    required: false
    default: ''
  pull_request_id:
    description: 'Pull request id (otherwise attempt to extract it from the GitHub metadata)'
    required: false
    default: ''
  allowed_users:
    description: 'Comma-separated list of GitHub usernames this action will run for, if empty it will run for all users'
    required: false
    default: ''
  openai_model:
    description: 'OpenAI model to use when provider is openai, needs to be compatible with the chat/completions endpoint'
    required: false
    default: 'gpt-5-mini'
  anthropic_model:
    description: 'Claude model to use when provider is anthropic, e.g. claude-haiku-4-5-20251001, claude-sonnet-5 or claude-opus-5. Models that think by default (Sonnet 5, Opus 5) spend part of max_tokens on thinking, so give them more headroom.'
    required: false
    default: 'claude-haiku-4-5-20251001'
  max_tokens:
    description: 'Maximum number of output/completion tokens the model may generate. Reasoning models (gpt-5*, gpt-6*, o1*, o3*, o4*) spend part of this budget on hidden reasoning tokens before any visible output, so a large diff can need more headroom than a classic model would. This is a ceiling, not a cost per run.'
    required: false
    default: '6000'
  max_diff_tokens:
    description: 'Maximum number of tokens worth of PR diff to send to the model, counted with the real tokenizer for the selected OpenAI model (an approximation for Claude models)'
    required: false
    default: '6000'
  exclude_patterns:
    description: 'Comma-separated glob patterns for files to exclude from the diff sent to the model, e.g. lockfiles or generated code'
    required: false
    default: '*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml,*.min.js,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,dist/*,build/*'
  temperature:
    description: 'Temperature for the model, higher values will make the model more creative, lower values will make it more conservative. Ignored for reasoning models (e.g. gpt-5*, gpt-6*, o1*, o3*), which only support the default temperature, and always ignored when provider is anthropic.'
    required: false
    default: '0.6'
  sample_prompt:
    description: 'Sample prompt to use for the model, refer to SAMPLE_PROMPT in pr_description/llm.py. Only used in classic mode, see docs/CONFIGURATION.md.'
    required: false
    default: ''
  sample_response:
    description: 'A sample of an ideal response based on the sample prompt. Only used in classic mode, see docs/CONFIGURATION.md.'
    required: false
    default: ''
  completion_prompt:
    description: 'Prompt to use as the final prompt to the model, refer to COMPLETION_PROMPT in pr_description/llm.py.'
    required: false
    default: ''
  overwrite_description:
    description: 'What to do with an existing PR description: "never" only fills in a blank one, "always" regenerates it on every run, "smart" has the model keep it, extend it, or replace it if it is generic or thin. "true"/"false" still work as always/never.'
    required: false
    default: 'never'
  description_style:
    description: 'How structured-mode descriptions are formatted: "rich" uses emoji section headings and GitHub callouts to draw attention to key points, "plain" uses bold subheadings and bullets. Classic mode is unaffected.'
    required: false
    default: 'rich'
  generate_title:
    description: 'Ask the model to also propose an improved pull request title'
    required: false
    default: 'false'
  overwrite_title:
    description: 'What to do with the model-proposed title (requires generate_title): "never" only prints it in the action log, "always" applies it, "smart" applies it only when the current title is a placeholder or the model judges it vague or wrong. "true"/"false" still work as always/never.'
    required: false
    default: 'never'
  enable_labels:
    description: 'Ask the model to choose labels (from label_taxonomy) for the pull request and apply them, creating any that do not yet exist in the repository'
    required: false
    default: 'false'
  overwrite_labels:
    description: 'What to do when the PR already has labels (requires enable_labels): "never" only labels a PR with none, "always" makes the taxonomy labels match the model choice, "smart" has the model review the current labels and change only what is clearly wrong or missing. Labels outside label_taxonomy are never removed, and neither is breaking-change.'
    required: false
    default: 'never'
  label_taxonomy:
    description: 'Comma-separated list of labels the model is allowed to choose from when enable_labels is true'
    required: false
    default: 'bug,feature,enhancement,documentation,dependencies,refactor,test,chore'
  detect_breaking_changes:
    description: 'Ask the model to flag likely breaking changes on every run; when detected, a note is added to the top of the description and a "breaking-change" label is applied, whatever the overwrite_* and enable_labels inputs say. Needs issues: write for the label.'
    required: false
    default: 'false'
  attribution:
    description: 'Append a small "Created using devsetgo/ai-pr-assistant with <model>" footer to the generated description. Set to false to omit it.'
    required: false
    default: 'true'
  azure_endpoint:
    description: 'Azure endpoint for OpenAI, if you are using Azure. Setting this will make the action use Azure OpenAI. Only applies when provider is openai.'
    required: false
    default: ''
  azure_openai_api_version:
    description: 'OpenAI API version, if you are using Azure.'
    required: false
    default: ''

runs:
  using: 'docker'
  image: 'docker://ghcr.io/devsetgo/ai-pr-assistant:26.09.20-002'
branding:
  icon: 'cpu'
  color: 'green'
